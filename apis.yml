aid: food-info
url: https://raw.githubusercontent.com/api-evangelist/food-info/refs/heads/main/apis.yml
name: Food Info
description: Food Info serves harmonised nutrient data for reference foods over a versioned REST API.
  It merges six food-composition datasets — USDA FoodData Central, McCance & Widdowson's CoFID, ANSES
  Ciqual, DTU Frida, AUSNUT and Open Food Facts — into a single schema, so a caller can query nutrients
  across sources without reconciling each publisher's format. Endpoints cover food search, a full nutrient
  panel per food, a nutrient catalogue, reverse nutrient search for the richest and poorest reference
  foods, and recipe parsing and analysis that resolves raw ingredient lines into per-line nutrition. Authentication
  is an X-Api-Key header, with a free tier of 10 requests a minute and 100 a day. HTTPS only and CORS
  disabled, so it is built for server-to-server use. The underlying dataset carries a citable Zenodo DOI,
  which is unusual provenance for a commercial data API.
