python: |
  import os, requests

  BASE = "https://api.food-info.org"
  H = {"X-Api-Key": os.environ["FOOD_INFO_API_KEY"]}

  # 1. resolve a food name to a catalogue id
  hits = requests.get(f"{BASE}/api/v1/foods/search",
                      params={"q": "cheddar cheese", "home_nation": "GB", "limit": 10},
                      headers=H, timeout=30).json()
  food_id = hits[0]["id"]

  # 2. full nutrient panel on the UK reference-intake basis
  panel = requests.get(f"{BASE}/api/v1/foods/{food_id}/panel",
                       params={"source": "UK RI"}, headers=H, timeout=30).json()

  for group in panel.get("groups", []):
      for row in group.get("rows", []):
          print(group.get("title"), row)
javascript: |
  const BASE = "https://api.food-info.org";
  const headers = { "X-Api-Key": process.env.FOOD_INFO_API_KEY };

  // reverse nutrient search: foods richest in a nutrient
  const nutrients = await (await fetch(`${BASE}/api/v1/nutrients`, { headers })).json();
  const iron = nutrients.find((n) => n.name.toLowerCase() === "iron");

  const top = await (
    await fetch(`${BASE}/api/v1/nutrients/${iron.id}/top-foods?limit=25`, { headers })
  ).json();

  console.log(top.nutrient, top.results.slice(0, 5)); // amounts are per 100 g
notes:
- Server-to-server only — CORS is disabled, so the browser examples above are Node/Deno, not browser
  fetch.
- No secret is embedded: every sample reads the key from the environment.
- The free tier allows 10 requests a minute and 100 a day per account, so cache listNutrients rather
  than re-fetching it.
